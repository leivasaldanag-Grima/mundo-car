spring.application.name=mundocar
server.port=8080
# Base de datos local H2, carpeta data ignorada por Git.
spring.datasource.url=jdbc:h2:file:./data/mundocar;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Prototipo educativo: no exponer este servidor a Internet sin autenticación.
